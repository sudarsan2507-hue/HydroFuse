databases:
  - name: seepsense-db
    plan: free
    databaseName: seepsense
    user: seepsense

services:
  - type: web
    name: seepsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Free plan has no persistent disk, so SQLite can't survive a
      # redeploy - DATABASE_URL points backend.config.database_url() at
      # Render's free Postgres instead (see backend/config.py). No other
      # code change needed; SQLAlchemy abstracts the rest.
      - key: DATABASE_URL
        fromDatabase:
          name: seepsense-db
          property: connectionString
